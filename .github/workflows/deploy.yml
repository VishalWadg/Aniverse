name: CI/CD Pipeline & Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # JOB 1: Calculate Version, Build Artifacts, & Push to GHCR
  # -------------------------------------------------------------
  build-and-tag:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.SHORT_SHA }}
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full depth required for commit log tag calculation

      # 1. Compute Short SHA
      - name: Compute short SHA
        id: sha
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 2. Automatically Calculate & Create SemVer Tag using Conventional Commits
      - name: Compute next version (no push yet)
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true 

      # 3. Set up Java Environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 4. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build & Push Backend Jib Image (Tagged with SHA AND SemVer Tag)
      - name: Build and Push Backend Jib Image
        run: |
          cd Backend
          chmod +x mvnw
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Multi-tag in ONE build step: latest, SHORT_SHA, and SemVer tag
          ./mvnw compile jib:build \
            -Dimage=ghcr.io/${REPO_LOWER}-backend:latest \
            -Djib.to.tags=${{ env.SHORT_SHA }},${{ steps.tagger.outputs.new_tag }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      # 6. Set up Docker Buildx for Frontend Build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Build & Push Frontend Docker Image (Multi-tagged in ONE step)
      - name: Build and Push Frontend Image
        run: |
          cd Frontend
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --file Dockerfile \
            --tag ghcr.io/${REPO_LOWER}-frontend:latest \
            --tag ghcr.io/${REPO_LOWER}-frontend:${{ env.SHORT_SHA }} \
            --tag ghcr.io/${REPO_LOWER}-frontend:${{ steps.tagger.outputs.new_tag }} \
            --build-arg VITE_APP_VERSION=${{ steps.tagger.outputs.new_tag }} \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Push the version tag now that images are published
        run: |
          git tag ${{ steps.tagger.outputs.new_tag }}
          git push origin ${{ steps.tagger.outputs.new_tag }}

      # 8. Auto-create GitHub Release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: Release ${{ steps.tagger.outputs.new_tag }}
          body: ${{ steps.tagger.outputs.changelog }}

  # -------------------------------------------------------------
  # JOB 2: Deploy to Production AWS VPS ONCE
  # -------------------------------------------------------------
  deploy:
    needs: build-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/aniverse-production"

      - name: SSH and deploy to AWS VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/aniverse-production
            
            # Use the clean SemVer tag for deployment & app version
            cat <<'EOF' | sed 's/^[ \t]*//' > .env
            IMAGE_TAG=${{ needs.build-and-tag.outputs.new_tag }}
            APP_VERSION=${{ needs.build-and-tag.outputs.new_tag }}
            SPRING_PROFILES_ACTIVE=prod
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_KEY=${{ secrets.CLOUDINARY_KEY }}
            CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}
            VITE_API_BASE_URL=https://${{ secrets.VPS_PUBLIC_DOMAIN }}/api/v1
            GITHUB_REPO=VishalWadg/Aniverse
            GITHUB_TOKEN=${{ secrets.GHCR_PAT }} 
            GITHUB_WEBHOOK_SECRET=${{ secrets.GH_WEBHOOK_SECRET }}
            EOF

            cat <<'EOF' | sed 's/^[ \t]*//' > Caddyfile
            ${{ secrets.VPS_PUBLIC_DOMAIN }} {
                handle /api/v1* {
                    reverse_proxy aniverse-backend:8080
                }
                handle {
                    reverse_proxy aniverse-frontend:8080
                }
            } 
            EOF

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker image prune -af
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

  # -------------------------------------------------------------
  # JOB 3: Deploy Static Site to GitHub Pages
  # -------------------------------------------------------------
  deploy-to-gh-pages:
    needs: build-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      - name: Build Frontend
        run: |
          cd Frontend
          export VITE_BACKEND_URL="https://${{ secrets.VPS_PUBLIC_DOMAIN }}/api/v1"
          export VITE_BASE_PATH="/Aniverse/"
          export VITE_APP_VERSION="${{ needs.build-and-tag.outputs.new_tag }}"
          npm run build
      - name: Create 404 fallback page
        run: cp Frontend/dist/index.html Frontend/dist/404.html
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Frontend/dist
          branch: gh-pages